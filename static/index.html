<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webhook Catcher & Inspector</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --sidebar-width: 380px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Nav */
    header {
      height: 56px;
      padding: 0 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .brand-badge {
      background: #3b82f6;
      color: white;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .hook-url-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .hook-url-text {
      color: #38bdf8;
      user-select: all;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Layout */
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Sidebar Request List */
    .sidebar {
      width: var(--sidebar-width);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      background: rgba(10, 15, 29, 0.4);
    }

    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .search-input:focus { border-color: var(--accent); }

    .req-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .req-item {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .req-item:hover { background: rgba(255, 255, 255, 0.03); }
    .req-item.active { background: rgba(59, 130, 246, 0.15); border-left: 3px solid var(--accent); }

    .req-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .method-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .method-POST { background: #065f46; color: #34d399; }
    .method-GET { background: #1e3a8a; color: #60a5fa; }
    .method-PUT { background: #78350f; color: #fbbf24; }
    .method-DELETE { background: #7f1d1d; color: #f87171; }
    .method-PATCH { background: #581c87; color: #c084fc; }

    .req-time {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .req-path {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .req-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Inspector Main View */
    .inspector {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Code blocks and JSON */
    pre {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      font-size: 0.85rem;
      color: #38bdf8;
      line-height: 1.5;
    }

    .header-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }

    .header-table td {
      padding: 6px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .header-table td:first-child {
      font-weight: 600;
      color: #93c5fd;
      width: 30%;
    }

    /* Action bar */
    .actions-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .replay-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>⚡ Webhook Catcher</span>
      <span class="brand-badge" id="sse-badge">LIVE</span>
    </div>
    <div class="hook-url-box">
      <span>Endpoint URL:</span>
      <span class="hook-url-text" id="endpointUrl">http://localhost:4040/hook/default</span>
      <button class="btn btn-secondary" onclick="copyHookUrl()">📋 Copy</button>
    </div>
    <div>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ Clear All</button>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <input type="text" id="searchBox" class="search-input" placeholder="Search requests..." oninput="filterRequests()">
      </div>
      <div class="req-list" id="reqList">
        <div class="empty-state">Waiting for incoming requests...</div>
      </div>
    </div>

    <!-- Inspector -->
    <div class="inspector" id="inspectorView">
      <div class="empty-state">
        <h3>No request selected</h3>
        <p style="margin-top:6px; font-size:0.85rem;">Send a POST, GET, or PUT request to the URL above to inspect it.</p>
      </div>
    </div>
  </div>

  <script>
    let requests = [];
    let selectedReq = null;

    const currentOrigin = window.location.origin;
    document.getElementById("endpointUrl").innerText = `${currentOrigin}/hook/default`;

    function copyHookUrl() {
      navigator.clipboard.writeText(document.getElementById("endpointUrl").innerText);
      alert("Webhook URL copied to clipboard!");
    }

    function connectSSE() {
      const evt = new EventSource("/api/events");
      evt.onopen = () => {
        document.getElementById("sse-badge").style.background = "#10b981";
      };
      evt.onmessage = (e) => {
        try {
          const payload = JSON.parse(e.data);
          if (payload.type === "new_request") {
            requests.unshift(payload.data);
            renderList();
            if (!selectedReq) selectRequest(payload.data.uuid);
          } else if (payload.type === "clear") {
            requests = [];
            selectedReq = null;
            renderList();
            renderInspector();
          }
        } catch(err) {}
      };
      evt.onerror = () => {
        document.getElementById("sse-badge").style.background = "#ef4444";
      };
    }

    async function loadRequests() {
      try {
        const res = await fetch("/api/requests");
        const json = await res.json();
        if (json.ok) {
          requests = json.data;
          renderList();
          if (requests.length > 0) selectRequest(requests[0].uuid);
        }
      } catch (e) {}
    }

    function renderList() {
      const container = document.getElementById("reqList");
      const search = document.getElementById("searchBox").value.toLowerCase();
      const filtered = requests.filter(r => 
        r.path.toLowerCase().includes(search) || 
        r.method.toLowerCase().includes(search) ||
        (r.body && r.body.toLowerCase().includes(search))
      );

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No requests matched</div>';
        return;
      }

      container.innerHTML = filtered.map(r => `
        <div class="req-item ${selectedReq && selectedReq.uuid === r.uuid ? 'active' : ''}" onclick="selectRequest('${r.uuid}')">
          <div class="req-item-top">
            <span class="method-badge method-${r.method}">${r.method}</span>
            <span class="req-time">${new Date(r.created_at * 1000).toLocaleTimeString()}</span>
          </div>
          <div class="req-path">${r.path}</div>
          <div class="req-meta">
            <span>${r.client_ip}</span>
            <span>${r.size_bytes} B</span>
          </div>
        </div>
      `).join('');
    }

    function filterRequests() {
      renderList();
    }

    function selectRequest(uuid) {
      selectedReq = requests.find(r => r.uuid === uuid);
      renderList();
      renderInspector();
    }

    function renderInspector() {
      const container = document.getElementById("inspectorView");
      if (!selectedReq) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No request selected</h3>
            <p style="margin-top:6px; font-size:0.85rem;">Select an incoming request from the sidebar.</p>
          </div>
        `;
        return;
      }

      const r = selectedReq;
      let prettyBody = r.body;
      try {
        prettyBody = JSON.stringify(JSON.parse(r.body), null, 2);
      } catch(e) {}

      container.innerHTML = `
        <!-- Replay Action -->
        <div class="card">
          <div class="card-title">⚡ Replay Request</div>
          <div class="actions-bar">
            <input type="text" id="replayTarget" class="replay-input" placeholder="Forward to: http://localhost:8000/api/webhook" value="">
            <button class="btn btn-primary" onclick="triggerReplay()">Forward / Replay</button>
            <button class="btn btn-secondary" onclick="copyCurl()">Copy as cURL</button>
          </div>
          <div id="replayResult" style="margin-top:10px; font-size:0.82rem; display:none;"></div>
        </div>

        <!-- Headers -->
        <div class="card">
          <div class="card-title">Headers (${Object.keys(r.headers).length})</div>
          <table class="header-table">
            ${Object.entries(r.headers).map(([k, v]) => `
              <tr>
                <td>${k}</td>
                <td>${v}</td>
              </tr>
            `).join('')}
          </table>
        </div>

        <!-- Query Parameters -->
        ${Object.keys(r.query_params).length > 0 ? `
          <div class="card">
            <div class="card-title">Query Parameters</div>
            <table class="header-table">
              ${Object.entries(r.query_params).map(([k, v]) => `
                <tr>
                  <td>${k}</td>
                  <td>${v}</td>
                </tr>
              `).join('')}
            </table>
          </div>
        ` : ''}

        <!-- Payload Body -->
        <div class="card">
          <div class="card-title">
            <span>Payload Body</span>
            <span style="font-size:0.75rem; color:var(--text-muted);">${r.size_bytes} bytes</span>
          </div>
          <pre><code>${prettyBody ? escapeHtml(prettyBody) : '<em>(Empty Body)</em>'}</code></pre>
        </div>
      `;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    async function triggerReplay() {
      const target = document.getElementById("replayTarget").value;
      if (!target) return alert("Enter a target destination URL");
      const resBox = document.getElementById("replayResult");
      resBox.style.display = "block";
      resBox.innerHTML = "Forwarding request...";

      try {
        const res = await fetch("/api/replay", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ target_url: target, request_id: selectedReq.uuid })
        });
        const data = await res.json();
        if (data.ok) {
          resBox.innerHTML = `<span style="color:#34d399">✅ Status ${data.status} (${data.time_ms} ms)</span>`;
        } else {
          resBox.innerHTML = `<span style="color:#f87171">❌ Error: ${data.error || 'Status ' + data.status}</span>`;
        }
      } catch (err) {
        resBox.innerHTML = `<span style="color:#f87171">❌ Network Error</span>`;
      }
    }

    function copyCurl() {
      if (!selectedReq) return;
      const r = selectedReq;
      let curl = `curl -X ${r.method} "${window.location.origin}${r.path}"`;
      for (const [k, v] of Object.entries(r.headers)) {
        if (!["host", "content-length"].includes(k.toLowerCase())) {
          curl += ` \\\n  -H "${k}: ${v}"`;
        }
      }
      if (r.body) {
        curl += ` \\\n  -d '${r.body.replace(/'/g, "'\\''")}'`;
      }
      navigator.clipboard.writeText(curl);
      alert("cURL command copied!");
    }

    async function clearAll() {
      if (!confirm("Clear all captured requests?")) return;
      await fetch("/api/clear", { method: "POST" });
    }

    // Startup
    connectSSE();
    loadRequests();
  </script>
</body>
</html>
